name: local-check (temporary)
on:
  push:
    branches: [local-mode]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - uses: actions/upload-artifact@v4
        with:
          name: lockfile
          path: package-lock.json
      - if: always()
        run: npm run typecheck
      - if: always()
        run: npm test
      - if: always()
        run: npm run build
      - if: always()
        run: npm run build:local
      - if: always()
        run: cat dist/index.html && find dist -maxdepth 2 | head -40

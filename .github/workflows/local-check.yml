name: local-check (temporary)
on:
  push:
    branches: [local-mode]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Commit the updated lockfile
        run: |
          if ! git diff --quiet package-lock.json; then
            git config user.name github-actions && git config user.email github-actions@github.com
            git commit -m "Update package-lock.json for sql.js" package-lock.json && git push
          fi
      - if: always()
        run: npm run typecheck
      - if: always()
        run: npm test
      - if: always()
        run: npm run build
      - if: always()
        run: npm run build:local
      - if: always()
        run: cat dist/index.html && find dist -maxdepth 2 | head -40
